name: polishing
version: "0.1.0"
description: >
  Academic text polishing — enhance clarity, academic register, and
  publication quality. Detects and fixes common AI writing traces,
  weak argument patterns, and register issues.
category: capability

axes:
  section:
    detect: "章节检测"
    values:
      abstract: static/fragments/section/abstract.md
      intro: static/fragments/section/intro.md
      lit-review: static/fragments/section/lit-review.md
      method: static/fragments/section/method.md
      results: static/fragments/section/results.md
      discussion: static/fragments/section/discussion.md
      conclusion: static/fragments/section/conclusion.md
      full-paper: static/fragments/section/full-paper.md
    multi: true
    default: full-paper

  language:
    detect: "语言检测"
    values:
      zh: static/fragments/language/zh.md
      en: static/fragments/language/en.md
      zh-to-en: static/fragments/language/zh-to-en.md
    multi: false
    default: zh

  paper_type:
    detect: "论文类型检测"
    values:
      thesis: static/fragments/paper_type/thesis.md
      journal: static/fragments/paper_type/journal.md
    multi: false
    default: thesis

always_load:
  - ../../capabilities/_shared/ethics.md
  - ../../capabilities/_shared/terminology-ledger.md
  - static/core/stance.md
  - static/core/failure-modes.md

fragments:
  section:
    abstract: static/fragments/section/abstract.md
    intro: static/fragments/section/intro.md
    lit-review: static/fragments/section/lit-review.md
    method: static/fragments/section/method.md
    results: static/fragments/section/results.md
    discussion: static/fragments/section/discussion.md
    conclusion: static/fragments/section/conclusion.md
    full-paper: static/fragments/section/full-paper.md
  language:
    zh: static/fragments/language/zh.md
    en: static/fragments/language/en.md
    zh-to-en: static/fragments/language/zh-to-en.md
  paper_type:
    thesis: static/fragments/paper_type/thesis.md
    journal: static/fragments/paper_type/journal.md

references:
  on_demand:
    - condition: "需要学术短语替换"
      path: references/phrasebank.md
    - condition: "需要风格质量检查"
      path: references/style-guardrails.md

requires:
  - core.docx_parser

entry_point: capabilities.polishing.handler:handle
cli_command: null
